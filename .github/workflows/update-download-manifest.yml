name: Update download manifest

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    # The deployment workflow always deploys main, so do not publish a manifest
    # produced by a manual run from another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the latest JabRef release
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(mktemp public/downloads.json.XXXXXX)
          trap 'rm -f "$manifest"' EXIT

          curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/JabRef/jabref/releases/latest \
            | jq --sort-keys '{version: .tag_name, assets: [.assets[] | {name, browser_download_url}]}' \
            > "$manifest"

          jq -e '(.assets | type == "array") and (.assets | length > 0)' "$manifest" > /dev/null
          mv "$manifest" public/downloads.json
      - name: Commit an updated manifest
        id: commit
        run: |
          set -euo pipefail

          if git diff --quiet -- public/downloads.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads.json
          git commit -m 'Update download manifest'
          manifest_sha=$(git rev-parse HEAD)
          git push origin "$manifest_sha":main
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Wait for the manifest commit to reach GitHub
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SHA: ${{ steps.commit.outputs.manifest_sha }}
        run: |
          set -euo pipefail

          for attempt in {1..15}; do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$MANIFEST_SHA" ]; then
              exit 0
            fi
            sleep 2
          done

          echo 'The manifest commit did not reach main in time.' >&2
          exit 1
      - name: Trigger static-site deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
