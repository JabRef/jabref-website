name: Update download manifest

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest JabRef release
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(mktemp public/downloads.json.XXXXXX)
          trap 'rm -f "$manifest"' EXIT

          curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/JabRef/jabref/releases/latest \
            | jq --sort-keys '{version: .tag_name, assets: [.assets[] | {name, browser_download_url}]}' \
            > "$manifest"

          jq -e '(.assets | type == "array") and (.assets | length > 0)' "$manifest" > /dev/null
          mv "$manifest" public/downloads.json
      - name: Commit an updated manifest
        run: |
          if git diff --quiet -- public/downloads.json; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads.json
          git commit -m 'Update download manifest'
          git push
