name: Build and deploy static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
        env:
          # Repository variable override: use `/` when the custom domain is live.
          NUXT_APP_BASE_URL: ${{ vars.NUXT_APP_BASE_URL || '/jabref-website/' }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  playwright-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Playwright version
        id: playwright
        run: |
          version=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Pin @playwright/test to an exact version so CI can select the matching Docker image.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  visual-regression:
    needs: playwright-version
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
        env:
          NUXT_APP_BASE_URL: /
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-regression-results
          path: test-results/
          if-no-files-found: ignore
